    latex: 10^9 A_\mathrm{s})
    drop: true
    renames: A
  As:
    value: 'lambda As_1e9: 1e-9 * As_1e9'
    latex: A_\mathrm{s}
  n_s:
    value: 0.96605
    latex: n_\mathrm{s}
  H0:
    prior:
      min: 50
      max: 90
    ref:
      dist: norm
      loc: 68
      scale: 0.5
    proposal: 0.5
    latex: H_0
  omegabh2:
    value: 0.022383
    latex: \Omega_\mathrm{b} h^2
  omegach2:
    prior:
      min: 0.06
      max: 0.3
    ref:
      dist: norm
      loc: 0.12011
      scale: 0.015
    proposal: 0.015
    latex: \Omega_\mathrm{c} h^2
  tau_reio:
    value: 0.0544
    latex: \tau_\mathrm{reio}
  # ----------------------------------------------------------------------------
  # ----------------------------------------------------------------------------
  # ----------------------------------------------------------------------------
  m_ncdm:
    value: 0.06
    latex: \sum m_\nu
    renames: mnu
  scf_c:
    value: 1.0e-06
    drop: true
    latex: c_{\rm scf}
  scf_parameters:
    value: 'lambda scf_c: str(scf_c) + ",1., 0.0"'
    derived: false
  scf_friction:
